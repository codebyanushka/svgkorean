server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

# One keepalive pool to the backend so nginx doesn't open a brand new TCP
# connection to it for every single proxied request (each request was
# paying a fresh TCP handshake to the backend container before this).
upstream backend_keepalive {
    server backend:8000;
    keepalive 32;
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/letsencrypt/live/3-110-176-254.sslip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/3-110-176-254.sslip.io/privkey.pem;

    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    gzip_types text/plain text/css application/json application/javascript application/xml text/xml;

    # CORS is handled by the backend's own CORSMiddleware (applies to every
    # response including /media/ StaticFiles) - do NOT also add CORS headers
    # here, a duplicate Access-Control-Allow-Origin header is rejected by
    # browsers as invalid, silently breaking cross-origin requests.

    # Backend API - proxied so the frontend never needs CORS for /api calls.
    location /api/ {
        proxy_pass http://backend_keepalive/api/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /health {
        proxy_pass http://backend_keepalive/health;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    # Real audio/image files served by the backend's StaticFiles mounts.
    location /media/ {
        proxy_pass http://backend_keepalive/media/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
    }

    # React Router SPA - any other path falls back to index.html.
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }
}
