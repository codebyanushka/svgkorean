server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name _;

    ssl_certificate     /etc/letsencrypt/live/3-110-176-254.sslip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/3-110-176-254.sslip.io/privkey.pem;

    # Firebase Hosting (https://hangugeo-app.web.app) is a different origin
    # from this backend, so CORS headers are needed here too (the backend's
    # own CORS middleware still runs, this just makes sure static/media
    # responses are also allowed for the same origin).
    add_header Access-Control-Allow-Origin "https://hangugeo-app.web.app" always;

    # Backend API - proxied so the frontend never needs CORS for /api calls.
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /health {
        proxy_pass http://backend:8000/health;
    }

    # Real audio/image files served by the backend's StaticFiles mounts.
    location /media/ {
        proxy_pass http://backend:8000/media/;
        proxy_set_header Host $host;
    }

    # React Router SPA - any other path falls back to index.html.
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }
}
