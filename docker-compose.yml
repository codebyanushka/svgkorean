services:
  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: hangugeo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: hangugeo
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hangugeo"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: always
    env_file:
      - ./backend/.env.production
    depends_on:
      db:
        condition: service_healthy
    volumes:
      # Real audio/textbook-image files live outside git (see .gitignore) -
      # this bind-mount is how they reach the container. Copy them onto the
      # server once (see deploy/README.md), they then persist across
      # rebuilds/restarts since it's a host directory, not container storage.
      - ./data:/app/data

  nginx:
    build: ./frontend
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - backend

volumes:
  pgdata:
